[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "daft-graph"
description = "Graph processing algorithms using Daft under the hood."
dependencies = ["daft>=0.7.5"]
dynamic = ["version"]
license = "Apache-2.0"
authors = []
maintainers = []
readme = "README.md"
requires-python = ">=3.10,<3.14"

[project.urls]

[dependency-groups]
dev = [
  "pre-commit==4.6.0",
  "pytest==9.1.1",
  "ruff==0.15.20",
  "mypy==2.1.0"
]

[tool.hatch.version]
source = "vcs"

[tool.mypy]
files = ["daft_graph/**/*.py", "tests/**/*.py"]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
